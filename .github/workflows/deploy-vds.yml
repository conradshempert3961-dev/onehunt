name: Deploy VDS

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/fix-all-vds-2866

      - name: Deploy and heal VDS
        env:
          VDS_PASSWORD: ${{ secrets.ONEHUNT_VDS_PASSWORD }}
        run: |
          sudo apt-get install -y -qq sshpass
          sshpass -p "$VDS_PASSWORD" ssh -o StrictHostKeyChecking=no -o ConnectTimeout=30 root@104.128.137.117 <<'EOF'
          set -Eeuo pipefail
          ROOT=/opt/onehunt
          BRANCH=cursor/fix-all-vds-2866
          mkdir -p "$ROOT"
          if [ ! -d "$ROOT/.git" ]; then
            git clone --depth 1 -b "$BRANCH" https://github.com/conradshempert3961-dev/onehunt.git "$ROOT"
          fi
          cd "$ROOT"
          git fetch origin "$BRANCH"
          git checkout -B "$BRANCH" "origin/$BRANCH" 2>/dev/null || git checkout -B "$BRANCH" FETCH_HEAD
          ONEHUNT_BRANCH="$BRANCH" bash scripts/deploy_vds_full.sh 104.128.137.117
          EOF
