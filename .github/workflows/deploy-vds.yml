name: Deploy VDS

on:
  workflow_dispatch:
  push:
    branches:
      - cursor/fix-all-vds-2866
      - main
    paths:
      - "scripts/vds_heal.sh"
      - "scripts/vds_one_click.sh"
      - "scripts/vds_stable_miniapp_url.sh"
      - "scripts/vds_nipio_https.sh"
      - "scripts/vds_cloudflare_named_tunnel.sh"
      - "scripts/vds_always_on.sh"
      - "scripts/vds_bot_health.sh"
      - "scripts/vds_miniapp_https_watchdog.sh"
      - "scripts/fix_vds_telegram.sh"
      - "scripts/vds_https_tunnel.sh"
      - "scripts/refresh_nginx_upstream.sh"
      - "bot.py"
      - "docker-compose.prod.yml"
      - ".github/workflows/deploy-vds.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/fix-all-vds-2866

      - name: Deploy and heal VDS
        env:
          VDS_PASSWORD: ${{ secrets.ONEHUNT_VDS_PASSWORD }}
        run: |
          if [ -z "${VDS_PASSWORD}" ]; then
            echo "::error::ONEHUNT_VDS_PASSWORD secret is empty. Add it in repo Settings → Secrets → Actions."
            exit 1
          fi
          sudo apt-get install -y -qq sshpass
          sshpass -p "$VDS_PASSWORD" ssh -o StrictHostKeyChecking=no -o ConnectTimeout=30 root@104.128.137.117 <<'EOF'
          set -Eeuo pipefail
          curl -fsSL https://raw.githubusercontent.com/conradshempert3961-dev/onehunt/cursor/fix-all-vds-2866/scripts/vds_heal.sh | bash
          EOF
